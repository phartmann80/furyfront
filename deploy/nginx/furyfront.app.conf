# Fury Front — nginx site config for furyfront.app
#
# Install: /etc/nginx/sites-available/furyfront.app
# Enable:  ln -s /etc/nginx/sites-available/furyfront.app /etc/nginx/sites-enabled/
#
# Document root: /var/www/furyfront/current  (symlink → releases/<commit>/)
# TLS: certbot or your CA. Our infrastructure — not Vercel/Netlify.
#
# V0.1: Godot web export is UNTHREADED — do NOT add COOP/COEP headers.

map $sent_http_content_type $ff_cacheable_immutable {
    default                                 0;
    "~*application/wasm"                    1;
    "~*application/octet-stream"            1;
    "~*video/mp4"                           1;
    "~*image/webp"                          1;
}

server {
    listen 80;
    listen [::]:80;
    server_name furyfront.app www.furyfront.app;
    return 301 https://furyfront.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name furyfront.app www.furyfront.app;

    # ssl_certificate     /etc/letsencrypt/live/furyfront.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/furyfront.app/privkey.pem;

    root /var/www/furyfront/current;
    index index.html;

    # Security (unthreaded Godot — no COOP/COEP)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-FuryFront-Threads off always;

    # Production health — static JSON stamped at deploy time (no Node required)
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /health.json /version.json =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Landing + game HTML — always revalidate (picks up new versioned asset names)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Site CSS/JS — short cache; HTML references ?v=<commit>
    location ~* ^/(css|js)/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Godot commit-versioned engine artifacts — safe immutable (index.<commit>.wasm etc.)
    location ~* ^/play/index\.[0-9a-f]+\.(wasm|js|pck)$ {
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream pck;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Godot ancillary assets (icons, worklets, splash) — must-revalidate per release
    location /play/ {
        types {
            application/wasm wasm;
            application/javascript js;
            application/octet-stream pck;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /play/index.html;
    }

    # Hero cinematic — stable asset, long cache
    location /media/ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            video/mp4 mp4 MP4;
            image/webp webp;
        }
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/furyfront.app.access.log;
    error_log  /var/log/nginx/furyfront.app.error.log;
}

# gzip in http {} block:
#   gzip on;
#   gzip_types application/javascript application/wasm text/css text/html application/json;
