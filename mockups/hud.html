<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuryFront HUD</title>
  <style>
    :root { --bg: #0c0e12; --amber: #e8a317; --line: #2a3038; --txt: #d6dbe0; --dim: #8b939c; --hp: #c44b3c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.3 "Segoe UI", sans-serif; }
    .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at center, #1a222c 0%, #0c0e12 70%); }
    .cross { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1px solid #fff; opacity: 0.7; }
    .hit { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; color: #fff; opacity: 0.85; }
    .compass { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 420px; letter-spacing: 8px; color: var(--dim); font-size: 11px; text-align: center; }
    .compass b { color: var(--amber); font-weight: 600; }
    .killfeed { position: absolute; top: 42px; left: 16px; color: var(--dim); }
    .killfeed div { margin-bottom: 4px; }
    .killfeed span { color: var(--amber); }
    .minimap { position: absolute; top: 16px; right: 16px; width: 132px; height: 132px; border: 1px solid var(--line); background: #11161c; }
    .minimap i { position: absolute; width: 6px; height: 6px; background: var(--amber); left: 62px; top: 90px; }
    .minimap em { position: absolute; width: 6px; height: 6px; background: #c44b3c; left: 40px; top: 36px; font-style: normal; }
    .hp { position: absolute; left: 16px; bottom: 18px; }
    .bar { width: 180px; height: 6px; background: #1c2228; }
    .bar > span { display: block; width: 72%; height: 100%; background: var(--hp); }
    .ammo { position: absolute; right: 20px; bottom: 18px; text-align: right; }
    .ammo strong { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
    .ammo small { color: var(--dim); }
    .ability { position: absolute; left: 16px; bottom: 52px; width: 28px; height: 28px; border: 1px solid var(--amber); color: var(--amber); display: grid; place-items: center; font-size: 10px; }
    .score { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: var(--dim); }
    .score b { color: var(--txt); }
    .streaks { position: absolute; right: 20px; bottom: 78px; text-align: right; color: var(--dim); font-size: 11px; }
    .streaks .ready { color: var(--amber); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="compass">NW&nbsp;&nbsp;N&nbsp;&nbsp;<b>NE</b>&nbsp;&nbsp;E&nbsp;&nbsp;SE</div>
    <div class="killfeed">
      <div><span>Vex</span>  KF-16  Rook</div>
      <div><span>Nyx</span>  WASP-9  Bishop</div>
    </div>
    <div class="minimap"><i></i><em></em></div>
    <div class="cross"></div>
    <div class="hit">+</div>
    <div class="ability">Q</div>
    <div class="hp">
      <div class="bar"><span></span></div>
      <div style="margin-top:6px;color:var(--dim)">72 HP · Golem plates 8</div>
    </div>
    <div class="score"><b>42</b> — 38 · TDM · BLACK HARBOR</div>
    <div class="streaks">
      <div class="ready">UAV 500</div>
      <div>AIR 900</div>
      <div>DRONE 1300</div>
    </div>
    <div class="ammo">
      <div><strong>24</strong> <small>| 90</small></div>
      <div style="color:var(--dim)">KF-16 VANGUARD</div>
    </div>
  </div>
</body>
</html>
